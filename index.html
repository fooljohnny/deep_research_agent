<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>每日洞察 · AI & Cloud</title>
  <link rel="stylesheet" href="css/github-markdown.min.css?v=3" />
  <style>
    :root {
      --c-bg: #f8f9fb;
      --c-surface: #ffffff;
      --c-text: #1a1a2e;
      --c-text-secondary: #6b7280;
      --c-text-tertiary: #9ca3af;
      --c-border: #e5e7eb;
      --c-border-light: #f0f0f3;
      --c-accent: #4f46e5;
      --c-accent-light: #6366f1;
      --c-accent-bg: rgba(79, 70, 229, 0.06);
      --c-accent-bg-hover: rgba(79, 70, 229, 0.10);
      --c-header-bg: rgba(255, 255, 255, 0.82);
      --c-shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
      --c-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
      --c-shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.08);
      --c-nav-bg: #fbfbfd;
      --c-code-bg: #f3f4f6;
      --c-progress: #4f46e5;
      --radius: 8px;
      --radius-lg: 12px;
      --max-content: 760px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Noto Sans", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #0f1117;
        --c-surface: #16181f;
        --c-text: #e6e8ee;
        --c-text-secondary: #9ca3af;
        --c-text-tertiary: #6b7280;
        --c-border: #2a2d36;
        --c-border-light: #222529;
        --c-accent: #818cf8;
        --c-accent-light: #a5b4fc;
        --c-accent-bg: rgba(129, 140, 248, 0.08);
        --c-accent-bg-hover: rgba(129, 140, 248, 0.14);
        --c-header-bg: rgba(22, 24, 31, 0.82);
        --c-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        --c-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
        --c-shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
        --c-nav-bg: #131520;
        --c-code-bg: #1e2028;
        --c-progress: #818cf8;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      background: var(--c-bg);
      color: var(--c-text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: 16px;
      line-height: 1.6;
    }

    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, var(--c-accent), var(--c-accent-light));
      z-index: 1000;
      transition: width 0.1s ease;
      box-shadow: 0 0 8px rgba(79, 70, 229, 0.3);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--c-header-bg);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--c-border);
      padding: 0 24px;
    }
    .site-header-inner {
      width: 100%;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .site-logo .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--c-accent), var(--c-accent-light));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }
    .site-logo .logo-text {
      background: linear-gradient(135deg, var(--c-accent), var(--c-accent-light));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .site-header .header-meta {
      font-size: 0.8rem;
      color: var(--c-text-tertiary);
    }
    .site-header .header-meta code {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      background: var(--c-code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--c-text-secondary);
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 57px);
    }

    .nav {
      width: 280px;
      flex-shrink: 0;
      border-right: 1px solid var(--c-border);
      background: var(--c-nav-bg);
      padding: 24px 16px 48px;
      overflow-y: auto;
      position: sticky;
      top: 57px;
      height: calc(100vh - 57px);
    }
    .nav::-webkit-scrollbar { width: 4px; }
    .nav::-webkit-scrollbar-track { background: transparent; }
    .nav::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 2px; }

    .nav .section { margin-bottom: 1.75rem; }
    .nav .section h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--c-text-tertiary);
      margin: 0 0 0.6rem;
      font-weight: 600;
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav .section h2::before {
      content: "";
      width: 3px;
      height: 12px;
      border-radius: 2px;
      background: var(--c-accent);
      opacity: 0.5;
    }

    .nav a {
      display: block;
      padding: 8px 12px;
      color: var(--c-text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      border-radius: var(--radius);
      transition: all 0.15s ease;
      margin-bottom: 2px;
      line-height: 1.4;
      border: 1px solid transparent;
    }
    .nav a:hover {
      background: var(--c-accent-bg);
      color: var(--c-accent);
      border-color: var(--c-border-light);
    }
    .nav a.active {
      font-weight: 600;
      background: var(--c-accent-bg-hover);
      color: var(--c-accent);
      border-color: var(--c-accent);
    }

    .hint {
      color: var(--c-text-tertiary);
      font-size: 0.72rem;
      line-height: 1.6;
      margin-top: 1.5rem;
      padding: 12px;
      border-radius: var(--radius);
      background: var(--c-code-bg);
      border: 1px solid var(--c-border-light);
    }
    .hint code {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      word-break: break-all;
      color: var(--c-accent);
    }

    .main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-width: 0;
    }
    .main::-webkit-scrollbar { width: 6px; }
    .main::-webkit-scrollbar-track { background: transparent; }
    .main::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 3px; }

    .readme-surface {
      flex: 1;
      max-width: var(--max-content);
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      padding: 48px 32px 96px;
      background: var(--c-surface);
      min-height: 100%;
    }
    @media (max-width: 900px) {
      .readme-surface { padding: 24px 20px 64px; }
    }

    .welcome {
      color: var(--c-text-secondary);
      max-width: var(--max-content);
      margin: 0 auto;
      text-align: center;
      padding: 80px 20px;
    }
    .welcome p { margin-bottom: 1rem; }
    .welcome code {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background: var(--c-code-bg);
      padding: 3px 8px;
      border-radius: 4px;
      color: var(--c-accent);
    }
    #loading {
      color: var(--c-text-tertiary);
      text-align: center;
      padding: 80px 20px;
      font-size: 0.9rem;
    }
    #loading::before {
      content: "";
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--c-border);
      border-top-color: var(--c-accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error {
      color: #ef4444;
      max-width: var(--max-content);
      margin: 0 auto;
      text-align: center;
      padding: 80px 20px;
      font-size: 0.9rem;
    }
    @media (prefers-color-scheme: dark) {
      #error { color: #f87171; }
    }

    .markdown-body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.75;
      color: var(--c-text);
      max-width: 100%;
    }

    .article-header {
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--c-border);
    }
    .article-header .article-title {
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -0.02em;
      margin: 0 0 0.75rem;
      padding-bottom: 0;
      border-bottom: none;
      color: var(--c-text);
    }
    .article-header .article-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .article-header .article-date {
      font-size: 0.8rem;
      color: var(--c-text-tertiary);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .article-header .article-date::before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--c-text-tertiary);
      display: inline-block;
    }
    .article-header .article-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .article-header .article-tag {
      font-size: 0.72rem;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--c-accent-bg);
      color: var(--c-accent);
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .article-header .article-tag:hover {
      background: var(--c-accent-bg-hover);
      border-color: var(--c-accent);
    }
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 2em;
      margin-bottom: 0.6em;
      scroll-margin-top: 80px;
    }
    .markdown-body h1 {
      font-size: 1.85rem;
      line-height: 1.3;
      padding-bottom: 0.4em;
      border-bottom: 2px solid var(--c-border);
    }
    .markdown-body h2 {
      font-size: 1.4rem;
      line-height: 1.35;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--c-border-light);
    }
    .markdown-body h3 {
      font-size: 1.15rem;
    }
    .markdown-body p {
      margin: 0 0 1.1em;
    }
    .markdown-body a {
      color: var(--c-accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }
    .markdown-body a:hover {
      border-bottom-color: var(--c-accent);
    }
    .markdown-body blockquote {
      margin: 1.5em 0;
      padding: 12px 20px;
      border-left: 4px solid var(--c-accent);
      background: var(--c-accent-bg);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--c-text-secondary);
    }
    .markdown-body blockquote p { margin: 0; }
    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: var(--c-code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--c-accent);
    }
    .markdown-body pre {
      border-radius: var(--radius-lg);
      box-shadow: var(--c-shadow-md);
      margin: 1.5em 0;
    }
    .markdown-body pre code {
      background: transparent;
      padding: 0;
      color: inherit;
    }
    .markdown-body table {
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--c-shadow);
      margin: 1.5em 0;
    }
    .markdown-body img {
      border-radius: var(--radius-lg);
      box-shadow: var(--c-shadow-md);
      max-width: 100%;
    }
    .markdown-body hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--c-border), transparent);
      margin: 2.5em 0;
    }
    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.5em;
      margin: 0 0 1.1em;
    }
    .markdown-body li { margin-bottom: 0.35em; }

    @media (prefers-color-scheme: dark) {
      .markdown-body { color: var(--c-text); }
      .markdown-body h1 { border-bottom-color: var(--c-border); }
      .markdown-body h2 { border-bottom-color: var(--c-border-light); }
      .markdown-body pre {
        background: var(--c-code-bg) !important;
      }
      .markdown-body table {
        background: var(--c-surface);
      }
      .markdown-body img {
        opacity: 0.92;
      }
    }

    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .nav {
        width: 100%;
        height: auto;
        max-height: 38vh;
        position: relative;
        top: 0;
        border-right: none;
        border-bottom: 1px solid var(--c-border);
        padding: 16px 12px;
      }
      .site-header { padding: 0 16px; }
      .site-header .header-meta { display: none; }
      .readme-surface { padding: 24px 16px 64px; }
    }
  </style>
</head>
<body>
  <div id="progress-bar"></div>

  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-logo" href="#">
        <span class="logo-icon">D</span>
        <span class="logo-text">每日洞察</span>
      </a>
      <div class="header-meta">
        <code id="repo-label"></code>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="nav" id="nav">
      <div class="section">
        <h2>AI Daily Insight</h2>
        <div id="list-ai"></div>
      </div>
      <div class="section">
        <h2>Cloud Daily Insight</h2>
        <div id="list-cloud"></div>
      </div>
      <p class="hint">
        目录由 GitHub API 读取仓库
        <br />
        每次打开页面都会重新请求列表与正文（禁用缓存）。<br />
        匿名访问有速率限制；若失败可在 URL 加参数
        <code>?owner=fooljohnny&repo=deep_research_agent&branch=main</code>
      </p>
    </nav>

    <main class="main" id="main-wrap">
      <div class="readme-surface">
        <p id="loading" class="welcome">正在加载文件列表…</p>
        <p id="error" style="display: none;"></p>
        <article id="article" class="markdown-body" style="display: none;"></article>
        <div id="welcome" class="welcome markdown-body" style="display: none;">
          <p>请从左侧选择一篇 <code>.md</code> 报告。</p>
          <p>链接可分享：<code id="sample-hash"></code></p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/marked.min.js?v=3"></script>
  <script src="js/purify.min.js?v=3"></script>
  <script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const CONFIG = {
    owner: params.get("owner") || "fooljohnny",
    repo: params.get("repo") || "deep_research_agent",
    branch: params.get("branch") || "main",
  };

  function pagesRepoRootPath() {
    var p = window.location.pathname || "/";
    if (p.endsWith("/")) {
      return p;
    }
    var slash = p.lastIndexOf("/");
    return slash >= 0 ? p.slice(0, slash + 1) : "/";
  }

  function sameOriginRepoFileUrl(relPath) {
    return window.location.origin + pagesRepoRootPath() + relPath;
  }

  function githubContentsApiUrl(relPath) {
    return (
      "https://api.github.com/repos/" +
      CONFIG.owner +
      "/" +
      CONFIG.repo +
      "/contents/" +
      relPath.split("/").map(encodeURIComponent).join("/") +
      "?ref=" +
      encodeURIComponent(CONFIG.branch)
    );
  }

  function decodeBase64Utf8(b64) {
    var bin = atob(b64.replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) {
      bytes[i] = bin.charCodeAt(i);
    }
    return new TextDecoder("utf-8").decode(bytes);
  }

  function guessImageMime(repoPath) {
    var ext = (repoPath.split(".").pop() || "").toLowerCase();
    var map = {
      png: "image/png",
      jpg: "image/jpeg",
      jpeg: "image/jpeg",
      gif: "image/gif",
      webp: "image/webp",
      svg: "image/svg+xml",
    };
    return map[ext] || "application/octet-stream";
  }

  async function fetchRepoTextViaApi(relPath) {
    var url = githubContentsApiUrl(relPath);
    var data = await fetchJson(url);
    if (data.encoding === "base64" && data.content) {
      return decodeBase64Utf8(data.content);
    }
    throw new Error("GitHub API 未返回可解码的正文: " + relPath);
  }

  async function fetchRepoTextWithFallback(relPath) {
    var candidates = [sameOriginRepoFileUrl(relPath), rawUrl(relPath)];
    for (var c = 0; c < candidates.length; c++) {
      try {
        var r = await fetch(withCacheBust(candidates[c]), FETCH_OPTS);
        if (r.ok) {
          return await r.text();
        }
      } catch (err) {
      }
    }
    return await fetchRepoTextViaApi(relPath);
  }

  async function fetchRepoBinaryAsDataUrl(relPath) {
    var data = await fetchJson(githubContentsApiUrl(relPath));
    if (data.encoding !== "base64" || !data.content) {
      throw new Error("无法通过 API 读取二进制: " + relPath);
    }
    var mime = guessImageMime(relPath);
    return "data:" + mime + ";base64," + data.content.replace(/\s/g, "");
  }

  const PATHS = {
    ai: "ai-daily-insight/content",
    cloud: "cloud-daily-insight/content",
  };

  document.getElementById("repo-label").textContent =
    CONFIG.owner + "/" + CONFIG.repo + "@" + CONFIG.branch;

  function withCacheBust(url) {
    var sep = url.indexOf("?") >= 0 ? "&" : "?";
    return url + sep + "_=" + Date.now();
  }

  var FETCH_OPTS = { cache: "no-store" };

  function rawUrl(relPath) {
    return (
      "https://raw.githubusercontent.com/" +
      encodeURIComponent(CONFIG.owner) +
      "/" +
      encodeURIComponent(CONFIG.repo) +
      "/" +
      encodeURIComponent(CONFIG.branch) +
      "/" +
      relPath.split("/").map(encodeURIComponent).join("/")
    );
  }

  function resolveMarkdownAssetToRepoPath(contentDir, src) {
    if (!src || /^https?:\/\//i.test(src) || src.trim().toLowerCase().startsWith("data:")) {
      return null;
    }
    if (src.startsWith("//")) {
      return null;
    }
    var pathPart = src.split("#")[0].split("?")[0].replace(/^\.\//, "");
    if (pathPart.startsWith("/")) {
      pathPart = pathPart.replace(/^\/+/, "");
    }
    var base = contentDir.split("/").filter(Boolean);
    var parts = pathPart.split("/").filter(function (s) {
      return s.length && s !== ".";
    });
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] === "..") {
        if (base.length) {
          base.pop();
        }
      } else {
        base.push(parts[i]);
      }
    }
    return base.join("/");
  }

  function normalizeMarkdownLegacyHeadings(md) {
    return (md || "").replace(/^##\s+#\s+/gm, "## ");
  }

  function stripErroneousOuterCodeFences(md) {
    var text = (md || "").replace(/^\uFEFF/, "");
    var lines = text.split(/\r?\n/);
    if (lines.length < 3 || String(lines[0]).trim() !== "```") {
      return md;
    }
    if (!String(lines[1] || "").trim().startsWith("---")) {
      return md;
    }
    var endYaml = -1;
    for (var i = 2; i < lines.length; i++) {
      if (/^---\s*$/.test(lines[i])) {
        endYaml = i;
        break;
      }
    }
    if (endYaml < 0) {
      return md;
    }
    var i = endYaml + 1;
    if (i < lines.length && String(lines[i]).trim() === "```") {
      i++;
    }
    while (i < lines.length && String(lines[i]).trim() === "") {
      i++;
    }
    var body = lines.slice(i).join("\n");
    body = body.replace(/\r?\n```\s*$/m, "");
    body = body.replace(/```\s*$/m, "");
    return body.replace(/^\uFEFF/, "").trimStart();
  }

  function parseFrontMatter(md) {
    var text = (md || "").replace(/^\uFEFF/, "");
    var fm = { title: null, date: null, tags: null };
    var lines = text.split(/\r?\n/);
    if (lines.length < 2 || String(lines[0]).trim() !== "---") {
      return { meta: fm, body: md };
    }
    var endIdx = -1;
    for (var i = 1; i < lines.length; i++) {
      if (/^---\s*$/.test(lines[i])) {
        endIdx = i;
        break;
      }
    }
    if (endIdx < 0) {
      return { meta: fm, body: md };
    }
    var yamlLines = lines.slice(1, endIdx);
    var bodyLines = lines.slice(endIdx + 1);
    for (var j = 0; j < yamlLines.length; j++) {
      var line = yamlLines[j];
      var mTitle = line.match(/^title:\s*(.+)$/);
      if (mTitle) {
        fm.title = mTitle[1].trim().replace(/^["']|["']$/g, "");
        continue;
      }
      var mDate = line.match(/^date:\s*(.+)$/);
      if (mDate) {
        fm.date = mDate[1].trim().replace(/^["']|["']$/g, "");
        continue;
      }
      var mTags = line.match(/^tags:\s*(.+)$/);
      if (mTags) {
        var raw = mTags[1].trim();
        if (raw.startsWith("[")) {
          raw = raw.replace(/^\[|\]$/g, "");
        }
        fm.tags = raw.split(",").map(function (t) {
          return t.trim().replace(/^["']|["']$/g, "");
        }).filter(Boolean);
        continue;
      }
    }
    return { meta: fm, body: bodyLines.join("\n").replace(/^\uFEFF/, "").trimStart() };
  }

  function normalizeMarkdownForRender(md) {
    return normalizeMarkdownLegacyHeadings(stripErroneousOuterCodeFences(md || ""));
  }

  function buildArticleHeaderHtml(meta) {
    if (!meta || (!meta.title && !meta.date && !meta.tags)) {
      return "";
    }
    var parts = [];
    parts.push('<div class="article-header">');
    if (meta.title) {
      parts.push('<h1 class="article-title">' + escapeHtml(meta.title) + '</h1>');
    }
    if (meta.date || meta.tags) {
      parts.push('<div class="article-meta">');
      if (meta.date) {
        parts.push('<span class="article-date">' + escapeHtml(meta.date) + '</span>');
      }
      if (meta.tags && meta.tags.length) {
        parts.push('<div class="article-tags">');
        for (var i = 0; i < meta.tags.length; i++) {
          parts.push('<span class="article-tag">' + escapeHtml(meta.tags[i]) + '</span>');
        }
        parts.push('</div>');
      }
      parts.push('</div>');
    }
    parts.push('</div>');
    return parts.join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function markdownToHtml(src) {
    var m = typeof marked !== "undefined" ? marked : null;
    if (!m) {
      throw new Error(
        "Markdown 引擎未加载（marked 缺失）。请确认仓库根目录存在 js/marked.min.js 且 Pages 已部署最新提交。"
      );
    }
    if (typeof m.setOptions === "function") {
      m.setOptions({ gfm: true, breaks: false });
    }
    if (typeof m.parse === "function") {
      return m.parse(src);
    }
    if (typeof m === "function") {
      return m(src);
    }
    throw new Error("Markdown 引擎 API 不兼容：marked 无 parse 且非函数。");
  }

  function sanitizeHtml(html) {
    if (typeof DOMPurify === "undefined" || !DOMPurify.sanitize) {
      throw new Error(
        "DOMPurify 未加载。请确认 js/purify.min.js 存在且可访问。"
      );
    }
    return DOMPurify.sanitize(html);
  }

  function rewriteImageSourcesInArticle(articleEl, contentDir) {
    articleEl.querySelectorAll("img[src]").forEach(function (img) {
      var repoPath = resolveMarkdownAssetToRepoPath(contentDir, img.getAttribute("src") || "");
      if (!repoPath) {
        return;
      }
      img.setAttribute("loading", "lazy");
      img.setAttribute("referrerpolicy", "no-referrer");

      var same = withCacheBust(sameOriginRepoFileUrl(repoPath));
      var raw = withCacheBust(rawUrl(repoPath));

      img.onerror = function onImgErr() {
        if (img.dataset.imgStage === "same") {
          img.dataset.imgStage = "raw";
          img.src = raw;
          return;
        }
        if (img.dataset.imgStage === "raw") {
          img.onerror = null;
          fetchRepoBinaryAsDataUrl(repoPath)
            .then(function (dataUrl) {
              img.src = dataUrl;
            })
            .catch(function () {
              img.alt = (img.alt || "图表") + "（无法加载：网络或 API 限制）";
            });
          return;
        }
      };

      img.dataset.imgStage = "same";
      img.src = same;
    });
  }

  async function fetchJson(url) {
    const r = await fetch(withCacheBust(url), {
      cache: "no-store",
      headers: { Accept: "application/vnd.github+json" },
    });
    if (!r.ok) {
      const t = await r.text();
      throw new Error(r.status + " " + r.statusText + (t ? ": " + t.slice(0, 200) : ""));
    }
    return r.json();
  }

  async function fetchManifest() {
    var url = withCacheBust(sameOriginRepoFileUrl("manifest.json"));
    var r = await fetch(url, FETCH_OPTS);
    if (!r.ok) throw new Error("manifest.json HTTP " + r.status);
    var data = await r.json();
    if (!data || typeof data !== "object") throw new Error("manifest.json invalid");
    return data;
  }

  async function listMarkdownViaApi(prefix) {
    const api =
      "https://api.github.com/repos/" +
      CONFIG.owner +
      "/" +
      CONFIG.repo +
      "/contents/" +
      prefix +
      "?ref=" +
      encodeURIComponent(CONFIG.branch);
    const data = await fetchJson(api);
    if (!Array.isArray(data)) {
      throw new Error("Unexpected API response for " + prefix);
    }
    return data
      .filter(function (item) {
        return item.type === "file" && /\.md$/i.test(item.name);
      })
      .sort(function (a, b) {
        return b.name.localeCompare(a.name);
      });
  }

  async function listMarkdown(bucket) {
    try {
      var manifest = await fetchManifest();
      var names = manifest[bucket];
      if (Array.isArray(names) && names.length) {
        return names.map(function (n) { return { name: n }; });
      }
    } catch (e) {
    }
    var prefix = PATHS[bucket];
    return await listMarkdownViaApi(prefix);
  }

  function setActive(hash) {
    document.querySelectorAll(".nav a").forEach(function (a) {
      a.classList.toggle("active", a.getAttribute("href") === hash);
    });
  }

  async function loadArticle(hash) {
    var m = /^#(ai|cloud)\/(.+\.md)$/.exec(hash);
    var article = document.getElementById("article");
    var welcome = document.getElementById("welcome");
    var loading = document.getElementById("loading");
    var errEl = document.getElementById("error");

    errEl.style.display = "none";
    welcome.style.display = "none";

    if (!m) {
      loading.style.display = "none";
      article.style.display = "none";
      welcome.style.display = "block";
      document.getElementById("sample-hash").textContent =
        window.location.pathname + window.location.search + "#ai/2026-03-20.md";
      setActive("");
      return;
    }

    var bucket = m[1];
    var file = m[2];
    var rel = PATHS[bucket] + "/" + file;

    loading.style.display = "block";
    loading.textContent = "正在加载 " + rel + " …";
    article.style.display = "none";

    try {
      var raw = normalizeMarkdownForRender(await fetchRepoTextWithFallback(rel));
      var parsed = parseFrontMatter(raw);
      var bodyMd = parsed.meta.title ? parsed.body : raw;
      var html = markdownToHtml(bodyMd);
      var headerHtml = buildArticleHeaderHtml(parsed.meta);
      article.innerHTML = sanitizeHtml(headerHtml + html);
      rewriteImageSourcesInArticle(article, PATHS[bucket]);
      article.style.display = "block";
      loading.style.display = "none";
      setActive(hash);
      document.title = (parsed.meta.title || file.replace(/\.md$/i, "")) + " · 洞察";
      var mainEl = document.getElementById("main-wrap");
      if (mainEl) mainEl.scrollTop = 0;
    } catch (e) {
      loading.style.display = "none";
      article.style.display = "none";
      errEl.textContent = String(e.message || e);
      errEl.style.display = "block";
      setActive("");
    }
  }

  function buildLink(bucket, name) {
    var a = document.createElement("a");
    a.href = "#" + bucket + "/" + name;
    a.textContent = name.replace(/\.md$/i, "");
    return a;
  }

  var hashListenerBound = false;

  async function refreshListsAndArticle() {
    var loading = document.getElementById("loading");
    var errEl = document.getElementById("error");
    var listAi = document.getElementById("list-ai");
    var listCloud = document.getElementById("list-cloud");
    var welcome = document.getElementById("welcome");

    errEl.style.display = "none";
    welcome.style.display = "none";
    loading.style.display = "block";
    loading.textContent = "正在加载最新文件列表…";
    listAi.innerHTML = "";
    listCloud.innerHTML = "";

    try {
      var aiFiles = await listMarkdown("ai");
      var cloudFiles = await listMarkdown("cloud");

      aiFiles.forEach(function (f) {
        listAi.appendChild(buildLink("ai", f.name));
      });
      cloudFiles.forEach(function (f) {
        listCloud.appendChild(buildLink("cloud", f.name));
      });

      loading.style.display = "none";
      if (!(window.location.hash || "").replace(/^#/, "")) {
        welcome.style.display = "block";
      }
      loadArticle(window.location.hash || "");
    } catch (e) {
      loading.style.display = "none";
      errEl.textContent =
        "加载目录失败（可能是 GitHub API 限速或分支名不对）。详情: " +
        (e.message || e) +
        " — 可尝试 URL 参数 ?branch=你的默认分支";
      errEl.style.display = "block";
    }
  }

  function bootstrap() {
    if (!hashListenerBound) {
      hashListenerBound = true;
      window.addEventListener("hashchange", function () {
        loadArticle(window.location.hash || "");
      });
    }

    var mainEl = document.getElementById("main-wrap");
    var progressBar = document.getElementById("progress-bar");
    if (mainEl && progressBar) {
      mainEl.addEventListener("scroll", function () {
        var max = mainEl.scrollHeight - mainEl.clientHeight;
        var pct = max > 0 ? (mainEl.scrollTop / max) * 100 : 0;
        progressBar.style.width = pct + "%";
      });
    }

    refreshListsAndArticle();
  }

  bootstrap();

  window.addEventListener("pageshow", function (ev) {
    if (ev.persisted) {
      refreshListsAndArticle();
    }
  });
})();
  </script>
</body>
